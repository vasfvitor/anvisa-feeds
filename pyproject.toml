[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvisa-feeds"
version = "0.1.0"
description = "Daily snapshots of ANVISA's filas de análise, published as static Atom feeds per subfila"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "anvisa>=0.2.0,<1",
  "typer>=0.12",
]

[project.scripts]
anvisa-feeds = "anvisa_feeds.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anvisa_feeds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/anvisa_feeds/cli.py" = ["B008"]
