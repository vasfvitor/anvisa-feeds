name: crawl

# Daily: snapshot every fila de análise through the official API, commit the snapshot, rebuild
# the static feeds and deploy them to GitHub Pages. Needs two repository secrets,
# ANVISA_CLIENT_ID and ANVISA_CLIENT_SECRET, and Pages set to "GitHub Actions" as the source.
# A crawl is a few hundred requests at 1/s; the client's throttle paces it.
#
# Four jobs on purpose: a rendering or deploy failure can never lose a crawl. The snapshot is
# also kept as a workflow artifact for 90 days, so a failed push can be recovered by hand.
# The cmed job runs after the crawl (same push sequence, no race) and only commits when the
# monthly list changed. "Run workflow" with build_only rebuilds the site from the committed
# snapshots without spending any requests.
#
# Red is for what needs a change here. A cause outside the code (a crawl with more than 10% of the
# subfilas missing, cmed/dados without anvisa-api's data, a CMED list older than 45 days) opens an
# issue instead (the alerta action from anvisa-hub), closed when it clears: see RUNBOOK.md.

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 America/Sao_Paulo
  # a code or contract change reaches the site at once (build only, no crawl): before, it waited
  # for the next morning, and the portal read the old cmed/dados until then
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/crawl.yml"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Rebuild and deploy the site from committed snapshots, no crawl"
        type: boolean
        default: false
      cmed_min_rows_ratio:
        description: >-
          Only when CMED's list really shrank: accept it with fewer rows than this share of the
          previous month, 0 to 1 (empty keeps the default, 0.95). RUNBOOK.md, "Lista da CMED encolheu".
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false   # never abort a crawl half-way

jobs:
  crawl:
    if: ${{ github.event_name != 'push' && !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      day: ${{ steps.day.outputs.day }}   # the build reads this day's meta, even past midnight
    permissions:
      contents: write   # commit the snapshot
      issues: write     # the alarm issue (alerta)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - id: day
        run: echo "day=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Crawl
        env:
          ANVISA_CLIENT_ID: ${{ secrets.ANVISA_CLIENT_ID }}
          ANVISA_CLIENT_SECRET: ${{ secrets.ANVISA_CLIENT_SECRET }}
        run: uv run anvisa-feeds crawl --snapshots snapshots
      - name: Keep the snapshot as an artifact (survives a failed push)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: snapshot-${{ steps.day.outputs.day }}
          path: |
            snapshots/${{ steps.day.outputs.day }}.*
            snapshots/catalog.json
          retention-days: 90
          if-no-files-found: error
      - name: Commit and push the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "snapshot ${{ steps.day.outputs.day }}"
          # something may have landed on main during the crawl: rebase and retry, then fail loudly
          git push || (git pull --rebase origin main && git push) \
                   || (sleep 30 && git pull --rebase origin main && git push)
      # after the commit, so a partial crawl is still kept and published (its failed subfilas
      # say "não coletada"). More than 10% missing opens the "Coleta incompleta" issue; the run
      # stays green, and the build job still puts the notice on every page.
      - name: Count the subfilas that were not collected
        id: coleta
        env:
          DAY: ${{ steps.day.outputs.day }}
          META: snapshots/${{ steps.day.outputs.day }}.meta.json
        run: |
          total=$(jq .subfilas_total "$META"); falhas=$(jq '.failed | length' "$META")
          echo "$falhas of $total subfilas not collected"
          {
            if [ $((falhas * 10)) -gt "$total" ]; then echo "estado=ativo"; else echo "estado=normal"; fi
            echo "titulo=Coleta incompleta: $falhas de $total subfilas não responderam"
            echo "corpo<<FIM_DO_CORPO"
            echo "Mais de 10% das subfilas não responderam na coleta de $DAY. As que falharam mostram a última fila coletada, e todas as páginas têm o aviso de coleta incompleta."
            echo
            jq -r '.failed[:40][] | "- subfila \(.subfila): \(.error)"' "$META"
            [ "$falhas" -gt 40 ] && echo "- e mais $((falhas - 40))"
            echo "FIM_DO_CORPO"
          } >> "$GITHUB_OUTPUT"
      - name: Alarm issue for an incomplete crawl
        if: ${{ !cancelled() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: feeds-coleta-incompleta
          titulo: ${{ steps.coleta.outputs.titulo }}
          estado: ${{ steps.coleta.outputs.estado }}
          corpo: ${{ steps.coleta.outputs.corpo }}
          runbook: https://github.com/vasfvitor/anvisa-feeds/blob/main/RUNBOOK.md#coleta-incompleta

  cmed:
    # CMED's price list changes once a month: two conditional GETs a day (no credentials) and,
    # when the files changed, a snapshot commit plus a Release that keeps the month's raw files
    needs: crawl
    if: ${{ always() && github.event_name != 'push' && !inputs.build_only && needs.crawl.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit the snapshot, create the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main   # after the crawl job's push
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - id: cmed
        name: Fetch the price list when it changed
        env:
          MIN_ROWS: ${{ inputs.cmed_min_rows_ratio }}
        run: |
          meta=$(uv run anvisa-feeds crawl-cmed --snapshots snapshots/cmed --raw-dir raw/cmed \
            ${MIN_ROWS:+--min-rows-ratio "$MIN_ROWS"})
          echo "$meta"
          echo "changed=$(jq -r 'if .unchanged then "false" else "true" end' <<<"$meta")" >> "$GITHUB_OUTPUT"
          echo "stamp=$(jq -r '.stamp // ""' <<<"$meta")" >> "$GITHUB_OUTPUT"
      - name: Keep the month's raw files in a Release
        if: steps.cmed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ steps.cmed.outputs.stamp }}
        run: |
          notes=$(jq -r '.files[] | "\(.name): \(.bytes) bytes, sha256 \(.sha256), Last-Modified \(.last_modified), from \(.url)"' "snapshots/cmed/$STAMP.meta.json")
          gh release create "cmed-$STAMP" raw/cmed/*.csv \
            --title "CMED $STAMP" \
            --notes "The two files of CMED's price list as ANVISA published them on dados.anvisa.gov.br, unchanged. Snapshot snapshots/cmed/$STAMP.jsonl.xz is derived from them.

          $notes"
      - name: Commit and push the snapshot
        if: steps.cmed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/cmed
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "cmed ${{ steps.cmed.outputs.stamp }}"
          git push || (git pull --rebase origin main && git push) \
                   || (sleep 30 && git pull --rebase origin main && git push)

  build:
    needs: [crawl, cmed]
    # also after a failed crawl: the site is rebuilt from the last good snapshot with a notice,
    # so a broken crawl is visible on the site instead of silently leaving it stale
    if: ${{ always() && needs.crawl.result != 'cancelled' && needs.cmed.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      situacao_build: ${{ steps.estado.outputs.situacao_build }}
      dcb_build: ${{ steps.estado.outputs.dcb_build }}
      cmed_dias: ${{ steps.estado.outputs.cmed_dias }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main   # the commits the crawl and cmed jobs just pushed, not this run's SHA
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Build the site
        env:
          CRAWL: ${{ needs.crawl.result }}
          DAY: ${{ needs.crawl.outputs.day }}
        # the notice reads the day's meta, not the crawl job's result: an incomplete crawl (more than
        # 10% missing) no longer turns that job red, it opens an issue
        run: |
          extra=()
          coletadas=0 falhas=0 total=0
          meta="snapshots/$DAY.meta.json"
          if [ -n "$DAY" ] && [ -f "$meta" ]; then
            coletadas=$(jq .subfilas_crawled "$meta"); falhas=$(jq '.failed | length' "$meta")
            total=$(jq .subfilas_total "$meta")
          fi
          if [ "$CRAWL" = failure ] && [ "$coletadas" -eq 0 ]; then
            extra=(--notice "A coleta de hoje falhou; estes dados são da última coleta bem-sucedida.")
          elif [ "$total" -gt 0 ] && [ $((falhas * 10)) -gt "$total" ]; then
            # a partial crawl was committed: its failed subfilas show their last collected queue
            extra=(--notice "A coleta de hoje ficou incompleta: $falhas subfilas não responderam e mostram a última fila coletada.")
          fi
          uv run anvisa-feeds build --snapshots snapshots --site site "${extra[@]}"
      # what the alarms after the deploy check; read here, where the site is, without failing,
      # so a red alarm never holds back a deploy. Empty means missing.
      - name: Record what the site was built from
        id: estado
        run: |
          jq -r '"situacao_build=\(.cmed.situacao_build // "")",
                 "dcb_build=\(.cmed.dcb_build // "")",
                 "cmed_dias=\(if .cmed.stamp then (now - (.cmed.stamp | strptime("%Y%m%d") | mktime)) / 86400 | floor else "" end)"' \
            site/meta.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # without this, a skipped crawl (build_only) also skips the deploy: the default success()
    # looks at every upstream job, not just `build`
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      issues: write   # the alarm issues (alerta)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

      # after the deploy, so what was collected is always published. The site going out without
      # the registration data or the official names (anvisa-api could not be read) and a CMED list
      # older than a month and a half open issues; a CMED list missing altogether stays red.
      - name: Check the anvisa-api sources and the CMED list's age
        id: fontes
        if: ${{ always() }}
        env:
          SITUACAO: ${{ needs.build.outputs.situacao_build }}
          DCB: ${{ needs.build.outputs.dcb_build }}
          CMED_DIAS: ${{ needs.build.outputs.cmed_dias }}
        run: |
          echo "registration build: ${SITUACAO:-none}; official names build: ${DCB:-none}; CMED list: ${CMED_DIAS:-?} days old"
          faltou=""
          [ -n "$SITUACAO" ] || faltou="a situação dos registros e as medidas"
          [ -n "$DCB" ] || faltou="${faltou:+$faltou e }os nomes oficiais (DCB)"
          {
            if [ -n "$faltou" ]; then echo "anvisa_estado=ativo"; else echo "anvisa_estado=normal"; fi
            echo "anvisa_corpo=O cmed/dados saiu sem $faltou, porque o build não conseguiu ler o anvisa-api. Preços e feeds saíram normais."
            if [ -n "$CMED_DIAS" ]; then
              if [ "$CMED_DIAS" -gt 45 ]; then echo "cmed_estado=ativo"; else echo "cmed_estado=normal"; fi
            fi
            echo "cmed_titulo=Lista da CMED com $CMED_DIAS dias"
            echo "cmed_corpo=A lista de preços da CMED publicada tem $CMED_DIAS dias. A CMED publica uma por mês; as páginas seguem com a lista atual."
          } >> "$GITHUB_OUTPUT"
          [ -n "$SITUACAO" ] || echo "cmed/dados went out without the registration status and measures (anvisa-api could not be read)"
          [ -n "$DCB" ] || echo "cmed/dados went out without the official names (anvisa-api could not be read)"
          if [ -z "$CMED_DIAS" ]; then
            echo "::error::the CMED list is missing"
            exit 1
          fi
      - name: Alarm issue for cmed/dados without anvisa-api's data
        if: ${{ always() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: feeds-anvisa-api-nao-lido
          titulo: O cmed/dados saiu sem os dados do anvisa-api
          estado: ${{ steps.fontes.outputs.anvisa_estado }}
          corpo: ${{ steps.fontes.outputs.anvisa_corpo }}
          runbook: https://github.com/vasfvitor/anvisa-feeds/blob/main/RUNBOOK.md#anvisa-api-não-foi-lido
      - name: Alarm issue for an old CMED list
        if: ${{ always() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: feeds-cmed-velha
          titulo: ${{ steps.fontes.outputs.cmed_titulo }}
          estado: ${{ steps.fontes.outputs.cmed_estado }}
          corpo: ${{ steps.fontes.outputs.cmed_corpo }}
          runbook: https://github.com/vasfvitor/anvisa-feeds/blob/main/RUNBOOK.md#lista-da-cmed-velha
